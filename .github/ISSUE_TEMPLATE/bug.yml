name: Bug
description: Something behaves incorrectly
labels: [type:bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Do not paste conversation text that contains personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
