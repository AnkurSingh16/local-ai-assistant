name: Feature
description: A scoped piece of work for a milestone
labels: [type:feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this delivers and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it is done, including the tests that prove it.
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: Related ADR
