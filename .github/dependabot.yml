version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # The runtime is pinned to Node 24 (package.json engines), so its types
      # stay on 24.x; a major bump would describe APIs the runtime lacks.
      # Remove this entry in the change that moves to a new Node major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Expo and React Native require one exact React version, pinned in the root
      # overrides; React moves together with an Expo SDK upgrade, never alone.
      # This also stops Dependabot security PRs for React: npm audit in CI fails
      # on a React advisory, and the fix comes by hand with an Expo patch or by
      # raising the override. Revisit these entries at each Expo SDK upgrade.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # Keeps the digest-pinned SearXNG image in compose.yaml current (ADR-0010).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
